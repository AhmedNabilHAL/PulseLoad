  # PostgreSQL database
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: pulseload
      POSTGRES_USER: ${POSTGRES_USER:-pulseload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseload}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  webapp_node_modules:
  postgres_data: