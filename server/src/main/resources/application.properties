spring.application.name=server
spring.profiles.active=dev

server.servlet.context-path=/api

spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

management.endpoints.web.exposure.include=health,info,metrics

# Surfaces MDC's runId (set by com.pulseload.engine.logging.RunMdcAspect around @RunMdcScope
# methods, plus one explicit MDC.putCloseable in TestRunServiceImpl) in plain-text console
# output, so grepping for one runId shows that run's full lifecycle. The structured (JSON)
# format used in prod includes all MDC key/values automatically.
logging.pattern.console=%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:-}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([runId=%X{runId}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}